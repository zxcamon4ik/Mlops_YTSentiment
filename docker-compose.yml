services:
  mlflow:
    build: .
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --serve-artifacts
      - --artifacts-destination
      - /mlflow/artifacts
      - --allowed-hosts
      - mlflow:5000,localhost:*,127.0.0.1:*
    ports:
      - "5001:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 12

  flask-api:
    build: .
    ports:
      - "5000:5000"
    environment:
      SERVER_URL: http://mlflow:5000
      MODEL_NAME: my_model
      MODEL_VERSION: "1"
      VECTORIZER_PATH: ./tfidf_vectorizer.pkl
    depends_on:
      mlflow:
        condition: service_healthy

volumes:
  mlflow-data:
