services:
  mlflow:
    build: .
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --serve-artifacts
      - --artifacts-destination
      - /mlflow/artifacts
      - --allowed-hosts
      - mlflow:5000,localhost:*,127.0.0.1:*
    ports:
      - "5001:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 12

  model-bootstrap:
    build: .
    command:
      - python
      - scripts/bootstrap_model.py
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: youtube_sentiment_model
      MODEL_ALIAS: champion
      MODEL_STAGE: Production
    depends_on:
      mlflow:
        condition: service_healthy

  api:
    build: .
    command:
      - python
      - scripts/run_api.py
    ports:
      - "5000:5000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: youtube_sentiment_model
      MODEL_ALIAS: champion
      MODEL_STAGE: Production
      API_HOST: 0.0.0.0
      API_PORT: "5000"
      MODEL_LOAD_RETRIES: "5"
      MODEL_LOAD_RETRY_SECONDS: "2"
      MODEL_WAIT_RETRIES: "60"
      MODEL_WAIT_SECONDS: "2"
    depends_on:
      mlflow:
        condition: service_healthy
      model-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  mlflow-data:
